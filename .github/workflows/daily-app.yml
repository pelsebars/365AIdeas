name: Build one backlog app

# Daily website publication; first complete cloud trial passed 2026-10-26.
on:
  schedule:
    - cron: '7 4,5 * * *' # Explicit UTC slots; gate below selects 06:07 Copenhagen.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to main after all checks pass (otherwise save checkpoint only)'
        type: boolean
        default: false

concurrency:
  group: daily-app-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  time-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - name: Select the Copenhagen slot using the workflow event time
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export EVENT_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          node scripts/schedule.mjs

  build:
    needs: time-slot
    if: github.ref == 'refs/heads/main' && needs.time-slot.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      has_work: ${{ steps.queue.outputs.has_work }}
      base: ${{ steps.queue.outputs.base }}
      prior: ${{ steps.queue.outputs.prior }}
      id: ${{ steps.queue.outputs.id }}
      action: ${{ steps.queue.outputs.action }}
      codex: ${{ steps.codex.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check runner and current project
        run: |
          npm run test:runner
          npm run check
          npm run test:browser
      - name: Keep trusted runner instructions outside candidate files
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-runner"
          cp scripts/cloud-runner.mjs scripts/backlog.mjs "$RUNNER_TEMP/trusted-runner/"
          cp .github/codex/daily-app.md "$RUNNER_TEMP/trusted-runner/prompt.md"
          mkdir -p "$RUNNER_TEMP/codex-build-home"
          cp .github/codex/config.toml "$RUNNER_TEMP/codex-build-home/config.toml"
      - name: Select or resume one backlog task
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted-runner/cloud-runner.mjs" prepare
      - name: Check API secret exists
        if: steps.queue.outputs.has_work == 'true' && steps.queue.outputs.action != 'deploy'
        env:
          HAS_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: test "$HAS_API_KEY" = true
      - name: Build the selected app with Codex
        id: codex
        if: steps.queue.outputs.has_work == 'true' && steps.queue.outputs.action != 'deploy'
        timeout-minutes: 45
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        env:
          BACKLOG_ID: ${{ steps.queue.outputs.id }}
          BACKLOG_ACTION: ${{ steps.queue.outputs.action }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/trusted-runner/prompt.md
          output-file: .runner-artifacts/codex-report.md
          model: gpt-6.1-sol
          effort: none
          codex-home: ${{ runner.temp }}/codex-build-home
          permission-profile: app-build
          safety-strategy: drop-sudo
      - name: Capture changes even if Codex fails or reaches its time limit
        if: always() && steps.queue.outputs.has_work == 'true'
        env:
          BASE_SHA: ${{ steps.queue.outputs.base }}
        run: node "$RUNNER_TEMP/trusted-runner/cloud-runner.mjs" capture
      - name: Save candidate and diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: app-candidate
          path: .runner-artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - name: Save runner browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: runner-browser-check
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Report empty queue
        if: steps.queue.outputs.has_work == 'false'
        run: echo 'No ready or interrupted task. No AI call or app build was started.' >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: build
    if: always() && needs.build.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          name: app-candidate
          path: ${{ runner.temp }}/candidate
      - name: Apply candidate with trusted infrastructure
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/candidate
        run: node scripts/cloud-runner.mjs apply
      - name: Require completed Codex run
        env:
          CODEX_OUTCOME: ${{ needs.build.outputs.codex }}
          BACKLOG_ACTION: ${{ needs.build.outputs.action }}
        run: test "$BACKLOG_ACTION" = deploy || test "$CODEX_OUTCOME" = success
      - name: Require completed app and functional browser test
        env:
          BACKLOG_ID: ${{ needs.build.outputs.id }}
          BASE_SHA: ${{ needs.build.outputs.base }}
        run: node scripts/cloud-runner.mjs ready
      - name: Install browser tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Independently validate candidate
        run: |
          npm run build
          git diff --exit-code
          npm run test:runner
          npm run check
          npm run test:browser
      - name: Save browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: app-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  save:
    needs: [build, validate]
    if: always() && needs.build.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.checkpoint.outputs.commit }}
      published: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.build.outputs.base }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          name: app-candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore permitted files only
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/candidate
        run: node scripts/cloud-runner.mjs apply
      # This job never runs generated application code with a write token.
      - name: Persist checkpoint on a separate branch
        id: checkpoint
        env:
          BASE_SHA: ${{ needs.build.outputs.base }}
          PRIOR_SHA: ${{ needs.build.outputs.prior }}
          BACKLOG_ID: ${{ needs.build.outputs.id }}
        run: node scripts/cloud-runner.mjs checkpoint
      - name: Publish validated candidate to main
        id: publish
        if: needs.validate.result == 'success' && (github.event_name == 'schedule' || inputs.publish)
        env:
          BASE_SHA: ${{ needs.build.outputs.base }}
          CANDIDATE_SHA: ${{ steps.checkpoint.outputs.commit }}
        run: node scripts/cloud-runner.mjs publish
      - name: Summarize result
        if: always()
        env:
          TASK_ID: ${{ needs.build.outputs.id }}
          VALIDATION: ${{ needs.validate.result }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          printf 'Task: %s\n\nValidation: %s\n\nPublish: %s\n\nCheckpoint branch: codex/daily-app-work\n' "$TASK_ID" "$VALIDATION" "$PUBLISH" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail visibly when app validation failed
        if: needs.validate.result != 'success'
        run: exit 1

  verify:
    needs: [build, save]
    if: needs.save.outputs.published == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.save.outputs.candidate }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Vercel status and public pages before recording publication
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.save.outputs.candidate }}
          BACKLOG_ID: ${{ needs.build.outputs.id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/cloud-runner.mjs verify
